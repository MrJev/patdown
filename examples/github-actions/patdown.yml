# Recommended consumer workflow. Uses the composite action at the repo root.
# Requires a published patdown release that matches the action tag, and
# repository secret TYPESAFE_API_KEY for the default judge.
name: patdown

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  patdown:
    name: Fuzzy lint (changed files)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: tyler-dot-earth/patdown@v0.7.0
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
