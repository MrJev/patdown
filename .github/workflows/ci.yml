name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24']
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        if: >-
          vars.TURBO_TEAM != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Check
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: |
          pnpm install
          pnpm check

      - name: Smoke-test built CLI
        run: |
          node apps/patdown/dist/patdown-cli-bin.js --version
          node apps/patdown/dist/patdown-cli-bin.js --help
          node apps/patdown/dist/patdown-cli-bin.js rules --rules AGENTS.PATDOWN.md

      - name: Smoke-test packed npm install
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/patdown-pack"
          install_dir="$RUNNER_TEMP/patdown-npm-install"
          mkdir -p "$pack_dir" "$install_dir"
          pnpm --filter @patdown/rules pack --pack-destination "$pack_dir"
          pnpm --filter patdown pack --pack-destination "$pack_dir"
          rules_tgz="$(echo "$pack_dir"/patdown-rules-*.tgz)"
          cli_tgz="$(ls "$pack_dir"/patdown-*.tgz | grep -v '/patdown-rules-')"
          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$rules_tgz" "$cli_tgz"
          shared_version="$(node -p "require('@effect/platform-node-shared/package.json').version")"
          effect_version="$(node -p "require('effect/package.json').version")"
          test "$shared_version" = "4.0.0-rc.116"
          test "$effect_version" = "4.0.0-rc.116"
          mkdir fixture && cd fixture
          printf '# Keep prose short\nglobs: **/*.md\n\nPrefer short sentences.\n' > rules.md
          npx patdown --version
          # rules reads through FileSystem; without the shared pin this fails with Service not found.
          npx patdown rules --rules rules.md
