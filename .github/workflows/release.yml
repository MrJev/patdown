name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        if: vars.TURBO_TEAM != ''
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Check
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: |
          pnpm install
          pnpm check

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          node scripts/release-notes.mjs "$tag" --verify-version > "$RUNNER_TEMP/release-notes.md"

          gh release create "$tag" \
            --verify-tag \
            --title="$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Secrets cannot be referenced in `if:`; skip quietly when the token is unset.
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN unset; skipping npm publish (use local OTP publish)."
            exit 0
          fi
          pnpm publish --filter @patdown/rules --access public --no-git-checks
          pnpm publish --filter @patdown/pi --access public --no-git-checks
          pnpm publish --filter @patdown/claude --access public --no-git-checks
          pnpm publish --filter @patdown/packs --access public --no-git-checks
          pnpm publish --filter patdown --access public --no-git-checks
