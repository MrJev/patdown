packages:
  - apps/*
  - packages/*

allowBuilds:
  '@google/genai': false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@earendil-works/pi-coding-agent': 0.85.1
  '@oxlint/plugins': 1.80.0
  '@types/node': ^22.20.3
  '@typescript/typescript6': 6.0.2
  '@vitest/coverage-v8': ^4.1.11
  import-meta-resolve: 4.2.0
  lint-staged: ^17.4.1
  oxfmt: ^0.65.0
  oxlint: 1.80.0
  oxlint-tsgolint: ^7.0.2001
  turbo: ^2.10.12
  typescript: 7.0.2
  vitest: ^4.1.11
  zod: ^4.4.3

catalogs:
  effect:
    '@effect/language-service': 0.87.2
    '@effect/tsgo': 0.45.0
    '@effect/platform-node': 4.0.0-rc.112
    '@effect/vitest': 4.0.0-rc.112
    effect: 4.0.0-rc.112

# platform-node ^rc.112 otherwise resolves platform-node-shared to rc.115, which imports effect/ByteSize missing from rc.112.
overrides:
  '@effect/platform-node-shared': 4.0.0-rc.112

engineStrict: true
frozenLockfile: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - pnpm
saveCatalogName: default
updateNotifier: false
